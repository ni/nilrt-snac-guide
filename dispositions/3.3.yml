3.3.1:
  status: implemented
  disposition:
  - NI LinuxRT event logging is handled by syslog-ng. By default, syslog is setup to harvest any log configuration files for other programs that introduce logging as long as they install conf files to ``/etc/syslog-ng.d/``.
3.3.2:
  status: implemented
  disposition:
  - The NILRT SNAC configuration uses the auditd kernel subsystem and auditd daemon to log important system events to the /var/log/audit log location.
3.3.3:
  status: implemented
  disposition:
  - The NILRT SNAC configuration uses the auditd kernel subsystem and auditd daemon to log important system events to the /var/log/audit log location. Audit logs are indefinitely retained.
3.3.4:
  status: end_user
  disposition:
  - System owners can configure auditd to send an email when there is a logging failure by setting ``action_mail_acct`` in ``/etc/audit/auditd.conf`` to a valid e-mail address and defining which alerts to send e-mails for in the audit.rules. User must define the response policy to these alerts.
3.3.5:
  status: not_applicable
  disposition:
  - The system owner is responsible to set up a process to review audit log records.
3.3.6:
  status: not_applicable
  disposition:
  - The system owner is responsible to set up audit record reduction tooling to review audit log records.
3.3.7:
  status: implemented
  disposition:
  - Syslog is configured to use UTC from the system hardware clock.
3.3.8:
  status: implemented
  disposition:
  - The NILRT SNAC configuration restricts write access to system logs to System Maintainers (via the ``root`` account), and System Auditors via membership in the ``adm`` group.
